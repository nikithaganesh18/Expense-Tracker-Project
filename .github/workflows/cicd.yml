name: CI-CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  APP_DIR: expense_tracker

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug structure
        run: |
          pwd
          ls -la
          ls -la expense_tracker

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r expense_tracker/requirements.txt
          pip install coverage pip-audit

      - name: Security Scan
        run: pip-audit -r expense_tracker/requirements.txt
        continue-on-error: true

      - name: Django Check
        run: |
          cd expense_tracker
          python manage.py check

      - name: Tests
        run: |
          cd expense_tracker
          coverage run manage.py test
          coverage xml

  cd:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest ./expense_tracker

      - name: Push Docker
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            docker compose pull
            docker compose down
            docker compose up -d