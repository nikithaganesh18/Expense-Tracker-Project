name: CI-CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  APP_DIR: expense_tracker

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AWS_REGION: eu-west-1
          AWS_STORAGE_BUCKET_NAME: expense-tracker-bills-nikitha
        run: |
          cd "$APP_DIR"
          python manage.py check

      - name: Run automated tests
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AWS_REGION: eu-west-1
          AWS_STORAGE_BUCKET_NAME: expense-tracker-bills-nikitha
        run: |
          cd "$APP_DIR"
          python manage.py test

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"
          pip install pip-audit

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r "$APP_DIR/requirements.txt"
        continue-on-error: true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: security_scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"
          pip install coverage

      - name: Generate coverage report
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AWS_REGION: eu-west-1
          AWS_STORAGE_BUCKET_NAME: expense-tracker-bills-nikitha
        run: |
          cd "$APP_DIR"
          coverage run manage.py test
          coverage xml

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: expense_tracker

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest "$APP_DIR"

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest

  deploy_ec2:
    name: CD to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy latest Docker image to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -f