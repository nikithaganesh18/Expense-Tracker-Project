name: CI-CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  APP_DIR: expense_tracker

jobs:
  ci:
    name: CI + Security + Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: expense_tracker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"
          pip install coverage pip-audit

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AWS_REGION: eu-west-1
          AWS_STORAGE_BUCKET_NAME: expense-tracker-bills-nikitha
        run: |
          cd "$APP_DIR"
          python manage.py check

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          AWS_REGION: eu-west-1
          AWS_STORAGE_BUCKET_NAME: expense-tracker-bills-nikitha
        run: |
          cd "$APP_DIR"
          coverage run manage.py test
          coverage xml
          coverage report

      - name: Run security scan
        run: |
          pip-audit -r "$APP_DIR/requirements.txt"
        continue-on-error: true

      - name: Run SonarCloud analysis
        if: github.ref == 'refs/heads/master'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: expense_tracker

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./expense_tracker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: CD to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy latest Docker image to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -f