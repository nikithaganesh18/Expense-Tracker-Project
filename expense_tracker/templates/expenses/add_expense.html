{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <p class="page-label">EXPENSES</p>
    <h1 class="page-title">Add Expense</h1>
</div>

<div class="panel" style="max-width:760px;">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background:#091633; color:#fff; border:none; padding:14px 20px; border-radius:10px; cursor:pointer;">
            Save Expense
        </button>
    </form>
</div>
{% endblock %}
