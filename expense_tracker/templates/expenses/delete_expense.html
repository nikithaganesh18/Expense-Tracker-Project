{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <p class="page-label">EXPENSES</p>
    <h1 class="page-title">Delete Expense</h1>
</div>

<div class="panel" style="max-width:760px;">
    <p style="margin-bottom:20px; font-size:18px;">Are you sure you want to delete <strong>{{ expense.title }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background:#c0392b; color:#fff; border:none; padding:14px 20px; border-radius:10px; cursor:pointer;">
            Yes, Delete
        </button>
        <a href="{% url 'expense_list' %}" style="margin-left:14px; color:#0b1736;">Cancel</a>
    </form>
</div>
{% endblock %}
