    <!-- Add Expense Modal -->
    <div id="expenseModal" class="custom-modal" style="display: none;">
        <div class="custom-modal-content">
            <div class="custom-modal-header">
                <h3>Add Expense</h3>
                <button type="button" class="modal-close" onclick="closeExpenseModal()">&times;</button>
            </div>

            <form method="POST" action="{% url 'add_expense' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="add-title">Title</label>
                    <input type="text" id="add-title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="add-amount">Amount</label>
                    <input type="number" step="0.01" id="add-amount" name="amount" required>
                </div>

                <div class="form-group">
                    <label for="add-category">Category</label>
                    <select id="add-category" name="category" required>
                        <option value="">Select category</option>
                        {% for choice in form.category.field.queryset %}
                            <option value="{{ choice.id }}">{{ choice.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="add-date">Date</label>
                    <input type="date" id="add-date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="add-description">Description</label>
                    <textarea id="add-description" name="description" rows="3"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeExpenseModal()">Cancel</button>
                    <button type="submit" class="expense-add-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Expense Modal -->
    <div id="editExpenseModal" class="custom-modal" style="display: none;">
        <div class="custom-modal-content">
            <div class="custom-modal-header">
                <h3>Edit Expense</h3>
                <button type="button" class="modal-close" onclick="closeEditExpenseModal()">&times;</button>
            </div>

            <form method="POST" id="editExpenseForm">
                {% csrf_token %}

                <div class="form-group">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="edit-amount">Amount</label>
                    <input type="number" step="0.01" id="edit-amount" name="amount" required>
                </div>

                <div class="form-group">
                    <label for="edit-category">Category</label>
                    <select id="edit-category" name="category" required>
                        <option value="">Select category</option>
                        {% for choice in form.category.field.queryset %}
                            <option value="{{ choice.id }}">{{ choice.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit-date">Date</label>
                    <input type="date" id="edit-date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" name="description" rows="3"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeEditExpenseModal()">Cancel</button>
                    <button type="submit" class="expense-add-btn">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Expense Modal -->
    <div id="deleteExpenseModal" class="custom-modal" style="display: none;">
        <div class="custom-modal-content">
            <div class="custom-modal-header">
                <h3>Delete Expense</h3>
                <button type="button" class="modal-close" onclick="closeDeleteExpenseModal()">&times;</button>
            </div>

            <p id="deleteExpenseText">Are you sure you want to delete this expense?</p>

            <form method="POST" id="deleteExpenseForm">
                {% csrf_token %}
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeDeleteExpenseModal()">Cancel</button>
                    <button type="submit" class="table-delete-btn">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openExpenseModal() {
            document.getElementById("expenseModal").style.display = "block";

            document.getElementById("add-title").value = "";
            document.getElementById("add-amount").value = "";
            document.getElementById("add-category").value = "";
            document.getElementById("add-description").value = "";

            // Add modal can default to today
            document.getElementById("add-date").value = new Date().toISOString().split("T")[0];
        }

        function closeExpenseModal() {
            document.getElementById("expenseModal").style.display = "none";
        }

        function openEditExpenseModal(id, title, amount, categoryId, expenseDate, description) {
            document.getElementById("editExpenseForm").action = `/expenses/edit/${id}/`;
            document.getElementById("edit-title").value = title;
            document.getElementById("edit-amount").value = amount;
            document.getElementById("edit-category").value = categoryId;

            // IMPORTANT: keep the original stored expense date
            document.getElementById("edit-date").value = expenseDate;

            document.getElementById("edit-description").value = description || "";
            document.getElementById("editExpenseModal").style.display = "block";
        }

        function closeEditExpenseModal() {
            document.getElementById("editExpenseModal").style.display = "none";
        }

        function openDeleteExpenseModal(id, title) {
            document.getElementById("deleteExpenseForm").action = `/expenses/delete/${id}/`;
            document.getElementById("deleteExpenseText").textContent =
                `Are you sure you want to delete "${title}"?`;
            document.getElementById("deleteExpenseModal").style.display = "block";
        }

        function closeDeleteExpenseModal() {
            document.getElementById("deleteExpenseModal").style.display = "none";
        }

        window.onclick = function(event) {
            const expenseModal = document.getElementById("expenseModal");
            const editExpenseModal = document.getElementById("editExpenseModal");
            const deleteExpenseModal = document.getElementById("deleteExpenseModal");

            if (event.target === expenseModal) {
                closeExpenseModal();
            }
            if (event.target === editExpenseModal) {
                closeEditExpenseModal();
            }
            if (event.target === deleteExpenseModal) {
                closeDeleteExpenseModal();
            }
        }
    </script>
